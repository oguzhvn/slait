name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (offline copies of pdf.js, KaTeX, Capacitor)
        run: npm run build:www

      - name: Create Android project
        run: |
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          # Slaity is meant to be used with the phone held sideways.
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"$/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Same key for every build, so a new APK installs over the old one and keeps the user's data.
      - name: Signing key
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../slaity.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slaity-apk
          path: slaity.apk

      - name: Publish as the "apk" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk slaity.apk --target "${{ github.sha }}" \
            --title "Slaity Android (son sürüm)" \
            --notes "Son Android sürümü: 1.${{ github.run_number }} ($(git log -1 --format=%h)). Telefonda slaity.apk dosyasını indirip aç; ilk seferde bilinmeyen kaynaklardan yüklemeye izin vermen gerekir."
